# Post-training config: demo data + verified-teacher data (M5).
#
# `teacher_roots` must contain LeRobot roots produced by
# `mosaic_n17/data/teacher_lerobot.write_teacher_dataset` from rollout-verified
# bank slots.  The teacher share is `mix_ratio` (sampling weight is
# relative_length * mix_ratio), not a loss weight.
schema: mosaic.n17.posttrain_config.v1

data:
  datasets:
    - dataset_paths:
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_1_meeting_room_milk_basket/2026-07-14-20-30-01
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_1_meeting_room_milk_basket/2026-07-14-19-15-12
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_2_office_red_cup_drawer/2026-07-22-19-33-29
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_2_office_red_cup_drawer/2026-07-22-20-13-55
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_3_kitchen_plate_milk_transfer/2026-07-23-19-14-37
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_4_diningroom_can_low_chair/2026-07-27-20-38-22
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_4_diningroom_can_low_chair/2026-07-27-20-38-30
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_4_diningroom_can_low_chair/2026-07-29-19-01-38
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/dataset/groot_sonic_vla/task_4_diningroom_can_low_chair/2026-07-29-19-01-58
      embodiment_tag: unitree_g1_sonic
      mix_ratio: 1.0
    - dataset_paths:
        - /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/runs/mosaic_n17/teachers/<run_id>
      embodiment_tag: unitree_g1_sonic
      mix_ratio: 0.2

model:
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  tune_vlln: true
  tune_top_llm_layers: 0
  state_dropout_prob: 0.2

training:
  start_from_checkpoint: /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/runs/groot_sonic_vla_baseline
  output_dir: /inspire/hdd/global_user/liumengfan-253108110079/flowbody/FlowBody/runs/groot_sonic_posttrain
  max_steps: 3000
  global_batch_size: 32
  save_steps: 500
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  use_wandb: false
